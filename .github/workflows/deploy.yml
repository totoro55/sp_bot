name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-sp-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, Windows, sp-bot]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check env file
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\sp_bot\.env')) {
            Write-Host 'Создайте C:\sp_bot\.env по образцу .env.example'
            exit 1
          }

      - name: Build and restart
        shell: powershell
        env:
          ENV_FILE: C:/sp_bot/.env
        run: |
          docker compose --env-file C:/sp_bot/.env up -d --build --force-recreate --remove-orphans
          docker image prune -f
          docker ps --filter name=sp-bot
